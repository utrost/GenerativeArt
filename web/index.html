<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/genart/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/genart/icons/icon-192.png" />
    <link rel="manifest" href="/genart/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generative Art</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/ui/style.css">
  </head>
  <body>
    <div id="mobile-redirect-banner" class="mobile-redirect-banner" hidden>
      <span>This layout is tight on phones.</span>
      <a href="./mobile.html">Open mobile studio</a>
      <button id="btn-stay-desktop" type="button">Stay desktop</button>
    </div>
    <div id="app">
      <nav class="sidebar">
        <div class="logo">
          <h1>GenArt</h1>
          <a href="https://simiono.com/generative-art" class="garden-link" title="Read about this project">by simiono</a>
        </div>
        <div class="generator-library" aria-label="Generator library">
          <input id="generator-search" class="generator-search" type="search" placeholder="Search generators, tags, styles…" autocomplete="off" />
          <div id="generator-category-filters" class="category-filters" aria-label="Generator categories"></div>
          <button id="btn-random-generator" class="secondary-btn random-generator-btn" type="button">Random from filter</button>
          <div id="generator-favorites" class="quick-generator-section"></div>
          <div id="generator-recent" class="quick-generator-section"></div>
        </div>
        <div class="generator-list" id="generator-list">
          <!-- Populated by JS -->
        </div>
      </nav>

      <main class="main-content">
        <div class="canvas-container">
            <div id="loading-indicator" class="hidden">Generating...</div>
            <div id="art-output">
                <!-- SVG injected here -->
            </div>
        </div>
      </main>

      <aside class="controls-panel">
        <div class="controls-header">
            <h2 id="active-generator-name">Select Generator</h2>
        </div>
        <div id="controls-container" class="controls-container">
            <!-- Dynamic Controls -->
        </div>
        <div class="actions">
            <button id="btn-generate" class="primary-btn">Generate</button>
            <button id="btn-download" class="secondary-btn">Download SVG</button>
        </div>
      </aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
